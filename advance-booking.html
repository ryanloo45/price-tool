<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提前订最优测算表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 24px;
  }
  .container {
    max-width: 1000px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    color: #fff;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header .subtitle {
    font-size: 14px;
    opacity: 0.85;
  }

  /* Input Panel */
  .input-panel {
    background: #fff;
    border-radius: 16px;
    padding: 24px 28px;
    margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: flex-end;
    justify-content: center;
  }
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .input-group label {
    font-size: 13px;
    font-weight: 600;
    color: #555;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .input-group label .icon {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #fff;
  }
  .input-group label .icon.date { background: linear-gradient(135deg, #667eea, #764ba2); }
  .input-group input[type="date"],
  .input-group input[type="number"] {
    height: 44px;
    padding: 0 14px;
    border: 2px solid #e8e8e8;
    border-radius: 10px;
    font-size: 16px;
    color: #333;
    outline: none;
    transition: all 0.25s;
    min-width: 180px;
    background: #fafafa;
  }
  .input-group input:focus {
    border-color: #764ba2;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.1);
  }

  /* Table */
  .table-wrapper {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .table-scroll {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    min-width: 800px;
  }

  /* Table Header */
  thead th {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    padding: 14px 12px;
    text-align: center;
    white-space: nowrap;
    border-bottom: none;
  }
  thead th.col-label {
    text-align: left;
    min-width: 90px;
  }
  thead th.col-date { min-width: 110px; }
  thead th.col-price { min-width: 110px; }
  thead th.col-rate { min-width: 100px; }
  thead th.col-face { min-width: 110px; }
  thead th.col-guard { min-width: 110px; }
  thead th.col-alert { min-width: 200px; }

  /* Table Body */
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid #f5f5f5;
    text-align: center;
    color: #444;
  }
  tbody td.col-label {
    text-align: left;
    font-weight: 600;
    color: #2d2d44;
    white-space: nowrap;
  }
  tbody td.col-date {
    color: #764ba2;
    font-weight: 500;
  }
  tbody td.col-price {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: #f5576c;
  }
  tbody td.col-rate {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: #4facfe;
  }
  tbody td.col-face {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 15px;
    color: #43e97b;
  }
  tbody td.col-face.today {
    color: #fa709a;
  }

  /* Editable inputs in table */
  tbody td input {
    width: 90px;
    height: 36px;
    padding: 0 10px;
    border: 2px solid #e8e8e8;
    border-radius: 8px;
    font-size: 14px;
    text-align: center;
    outline: none;
    transition: all 0.2s;
    background: #fafaff;
    font-family: inherit;
  }
  tbody td input:focus {
    border-color: #764ba2;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
  }

  /* Guard column badges */
  .guard-pass {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
  }
  .guard-fail {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f5576c, #f093fb);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
  }

  /* Alert column */
  .alert-text {
    font-size: 12px;
    color: #ff6b6b;
    font-weight: 500;
    background: #fff5f5;
    padding: 4px 10px;
    border-radius: 8px;
    display: inline-block;
  }
  .alert-empty {
    color: #ccc;
  }

  tbody tr:hover {
    background: linear-gradient(90deg, #f8f6ff, #fff);
  }
  tbody tr:last-child td {
    border-bottom: none;
  }
  tbody tr.today-row {
    background: linear-gradient(90deg, #fff0f5, #fff);
  }

  /* Legend */
  .legend {
    background: #fff;
    border-radius: 12px;
    padding: 16px 24px;
    margin-top: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    font-size: 13px;
    color: #666;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  /* Responsive */
  @media (max-width: 768px) {
    body { padding: 12px; }
    .input-panel { padding: 16px; gap: 14px; }
    .input-group input { min-width: 140px; }
    .header h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>提前订最优测算表</h1>
    <p class="subtitle">自动计算面客价与价格保障</p>
  </div>

  <div class="input-panel">
    <div class="input-group">
      <label><span class="icon date">D</span>监控日期</label>
      <input type="date" id="monitorDate" value="2026-08-01">
    </div>
  </div>

  <div class="table-wrapper">
    <div class="table-scroll">
      <table id="calcTable">
        <thead>
          <tr>
            <th class="col-label">预订日期</th>
            <th class="col-date">日期</th>
            <th class="col-price">主力房型门市价</th>
            <th class="col-rate">门店在手预订率</th>
            <th class="col-face">主力房型面客价</th>
            <th class="col-guard">提前订价格保障</th>
            <th class="col-alert">提前订流量提醒</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#43e97b"></span>面客价 = 门市价 × 折扣率</div>
    <div class="legend-item"><span class="legend-dot" style="background:#43e97b"></span>√ 面客价 ≤ 当天面客价</div>
    <div class="legend-item"><span class="legend-dot" style="background:#f5576c"></span>× 面客价 > 当天面客价（需调整）</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ff6b6b"></span>预订率超阈值时触发提醒</div>
  </div>
</div>

<script>
// ========== 行配置 ==========
// discount: 面客价折扣率
// alertThreshold: 预订率提醒阈值
// isToday: 是否为当天行
const rowConfig = [
  { label: '提前7天', offset: 7,  discount: 0.90, alertThreshold: 0.3, isToday: false },
  { label: '提前6天', offset: 6,  discount: 0.92, alertThreshold: 0.3, isToday: false },
  { label: '提前5天', offset: 5,  discount: 0.92, alertThreshold: 0.3, isToday: false },
  { label: '提前4天', offset: 4,  discount: 0.92, alertThreshold: 0.3, isToday: false },
  { label: '提前3天', offset: 3,  discount: 0.92, alertThreshold: 0.5, isToday: false },
  { label: '提前2天', offset: 2,  discount: 0.95, alertThreshold: 0.5, isToday: false },
  { label: '提前1天', offset: 1,  discount: 0.95, alertThreshold: 0.5, isToday: false },
  { label: '当天',   offset: 0,  discount: 0.98, alertThreshold: null, isToday: true },
];

// 默认数据
const defaultData = [
  { price: 300, rate: 0.25 },
  { price: 300, rate: 0.27 },
  { price: 300, rate: 0.33 },
  { price: 300, rate: 0.38 },
  { price: 300, rate: 0.42 },
  { price: 300, rate: 0.45 },
  { price: 300, rate: 0.51 },
  { price: 290, rate: 0.80 },
];

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function calculate() {
  const monitorDateStr = document.getElementById('monitorDate').value;
  if (!monitorDateStr) return;
  const monitorDate = new Date(monitorDateStr);

  // 读取所有输入值
  const inputData = [];
  rowConfig.forEach((row, idx) => {
    const priceInput = document.getElementById(`price-${idx}`);
    const rateInput = document.getElementById(`rate-${idx}`);
    const price = priceInput ? parseFloat(priceInput.value) || 0 : defaultData[idx].price;
    const rate = rateInput ? parseFloat(rateInput.value) || 0 : defaultData[idx].rate;
    inputData.push({ price, rate });
  });

  // 计算所有行的面客价
  const facePrices = inputData.map((d, i) => d.price * rowConfig[i].discount);
  const todayFacePrice = facePrices[facePrices.length - 1];

  // 只更新计算结果，不重建输入框
  rowConfig.forEach((row, idx) => {
    const { price, rate } = inputData[idx];
    const facePrice = facePrices[idx];

    // 更新日期
    const rowDate = new Date(monitorDate);
    rowDate.setDate(rowDate.getDate() - row.offset);
    const dateCell = document.getElementById(`date-${idx}`);
    if (dateCell) dateCell.textContent = formatDate(rowDate);

    // 更新面客价
    const faceCell = document.getElementById(`face-${idx}`);
    if (faceCell) faceCell.textContent = facePrice.toFixed(2);

    // 更新价格保障
    const guardCell = document.getElementById(`guard-${idx}`);
    if (guardCell) {
      if (row.isToday) {
        guardCell.innerHTML = '<span style="color:#ccc;font-size:13px;">—</span>';
      } else {
        guardCell.innerHTML = facePrice > todayFacePrice
          ? '<span class="guard-fail">×</span>'
          : '<span class="guard-pass">√</span>';
      }
    }

    // 更新流量提醒
    const alertCell = document.getElementById(`alert-${idx}`);
    if (alertCell) {
      if (row.alertThreshold === null) {
        alertCell.innerHTML = '<span class="alert-empty">—</span>';
      } else if (rate >= row.alertThreshold) {
        alertCell.innerHTML = `<span class="alert-text">${row.label}预订率已达${rate}，注意价格合理性</span>`;
      } else {
        alertCell.innerHTML = '<span class="alert-empty">—</span>';
      }
    }
  });
}

function buildTable() {
  const monitorDateStr = document.getElementById('monitorDate').value;
  if (!monitorDateStr) return;
  const monitorDate = new Date(monitorDateStr);

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  rowConfig.forEach((row, idx) => {
    const tr = document.createElement('tr');
    if (row.isToday) tr.classList.add('today-row');

    const rowDate = new Date(monitorDate);
    rowDate.setDate(rowDate.getDate() - row.offset);

    tr.innerHTML = `
      <td class="col-label">${row.label}</td>
      <td class="col-date" id="date-${idx}">${formatDate(rowDate)}</td>
      <td><input type="number" id="price-${idx}" value="${defaultData[idx].price}" min="0" step="1" style="color:#f5576c;font-weight:600;"></td>
      <td><input type="number" id="rate-${idx}" value="${defaultData[idx].rate}" min="0" max="1" step="0.01" style="color:#4facfe;font-weight:600;"></td>
      <td class="col-face ${row.isToday ? 'today' : ''}" id="face-${idx}">—</td>
      <td class="col-guard" id="guard-${idx}">—</td>
      <td class="col-alert" id="alert-${idx}">—</td>
    `;

    tbody.appendChild(tr);
  });

  // 绑定输入事件：只更新计算，不重建表格
  rowConfig.forEach((row, idx) => {
    const priceInput = document.getElementById(`price-${idx}`);
    const rateInput = document.getElementById(`rate-${idx}`);
    if (priceInput) priceInput.addEventListener('input', calculate);
    if (rateInput) rateInput.addEventListener('input', calculate);
  });

  // 首次计算
  calculate();
}

// 监控日期变化时重建表格
document.getElementById('monitorDate').addEventListener('change', buildTable);

// 初始化
buildTable();
</script>
</body>
</html>
