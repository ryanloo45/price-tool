<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒店价格工具箱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    max-width: 600px;
    width: 100%;
  }
  .header {
    text-align: center;
    color: #fff;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 6px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header p {
    font-size: 14px;
    opacity: 0.85;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  }
  .card-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 14px;
  }
  .card-icon.icon1 { background: linear-gradient(135deg, #f093fb, #f5576c); }
  .card-icon.icon2 { background: linear-gradient(135deg, #4facfe, #00f2fe); }
  .card h2 {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 6px;
  }
  .card p {
    font-size: 13px;
    color: #8c8c8c;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>酒店价格工具箱</h1>
    <p>选择下方工具开始使用</p>
  </div>
  <a class="card" href="./price-table.html">
    <div class="card-icon icon1">¥</div>
    <h2>新房价码价格梳理表</h2>
    <p>输入门市价、是否挂牌、早餐价格，自动计算各活动的官网价格和渠道价格</p>
  </a>
  <a class="card" href="./advance-booking.html">
    <div class="card-icon icon2">D</div>
    <h2>提前订最优测算表</h2>
    <p>输入监控日期、门市价、预订率，自动计算面客价与价格保障</p>
  </a>
</div>
</body>
</html>
